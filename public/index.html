<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F14" media="(prefers-color-scheme: dark)">
<title>Offseason College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* College's own look: Plus Jakarta Sans, cobalt + ember, floating glass chrome over a soft color field.
   Glass is only for the navigation layer (top buttons, tab bar, sheets); content sits on solid cards. */
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --card-2:#F3F5F9; --fill:rgba(120,128,150,.13); --fill-2:rgba(120,128,150,.08);
  --ink:#0B0D12; --ink-2:#3B4150; --muted:#7C8394; --line:rgba(20,30,60,.09);
  --accent:#2F5BFF; --accent-ink:#FFFFFF; --accent-soft:rgba(47,91,255,.10); --ember:#FF6B3D;
  --good:#1FB866; --good-soft:rgba(31,184,102,.12); --warn:#F59E0B; --bad:#EF4444; --bad-soft:rgba(239,68,68,.10);
  --glass:rgba(255,255,255,.55); --glass-hi:rgba(255,255,255,.95); --glass-edge:rgba(255,255,255,.7); --glass-shadow:0 12px 34px rgba(20,30,60,.16),0 2px 6px rgba(20,30,60,.06);
  --lens:rgba(255,255,255,.85); --orb1:#7AA2FF; --orb2:#FFB08A; --orb3:#9EE6FF; --orb-o:.55;
  --font:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  /* Spring curves: replaced at load by real spring simulations (linear()), these are the fallbacks. */
  --spring:cubic-bezier(.34,1.4,.5,1); --spring-d:560ms; --settle:cubic-bezier(.2,.9,.25,1); --settle-d:420ms;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D0F14; --card:#171A21; --card-2:#1F232C; --fill:rgba(140,150,175,.16); --fill-2:rgba(140,150,175,.09);
  --ink:#F4F6FB; --ink-2:#C2C8D6; --muted:#8890A3; --line:rgba(255,255,255,.07);
  --accent:#6B8CFF; --accent-ink:#0B0D12; --accent-soft:rgba(107,140,255,.16); --ember:#FF8A5C;
  --good:#34D399; --good-soft:rgba(52,211,153,.14); --bad:#F87171; --bad-soft:rgba(248,113,113,.14);
  --glass:rgba(38,42,54,.5); --glass-hi:rgba(255,255,255,.22); --glass-edge:rgba(255,255,255,.14); --glass-shadow:0 14px 38px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  --lens:rgba(255,255,255,.14); --orb1:#2C4BD6; --orb2:#B8461F; --orb3:#0E7490; --orb-o:.42;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--font);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .small{font-size:13px}

/* color field behind everything, so the glass has something to bend */
#field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#field i{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--orb-o);will-change:transform}
#field i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:var(--orb1);animation:drift1 26s ease-in-out infinite alternate}
#field i:nth-child(2){width:46vmax;height:46vmax;right:-18vmax;top:20vh;background:var(--orb2);animation:drift2 31s ease-in-out infinite alternate}
#field i:nth-child(3){width:40vmax;height:40vmax;left:10vw;bottom:-22vmax;background:var(--orb3);animation:drift3 23s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vmax,8vmax) scale(1.1)}}
@keyframes drift2{to{transform:translate(-10vmax,-6vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(8vmax,-10vmax) scale(1.08)}}

/* ---------- liquid glass ---------- */
.glass{position:relative;isolation:isolate;background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-hi),inset 0 -1px 0 rgba(255,255,255,.06),inset 0 0 0 1px var(--glass-edge)}
/* specular rim + a highlight that follows the finger */
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120px 80px at var(--mx,30%) var(--my,0%),rgba(255,255,255,.45),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 45%);
  opacity:.55;transition:opacity .3s}
.glass:hover::before{opacity:.85}
@media (prefers-color-scheme:dark){.glass::before{opacity:.25}.glass:hover::before{opacity:.45}}

/* stage: everything under the sheet, so it can recede when a sheet opens */
#stage{position:relative;z-index:1;min-height:100vh;transform-origin:50% 0;transition:transform var(--spring-d) var(--spring),border-radius var(--settle-d) var(--settle),filter var(--settle-d) var(--settle)}
body.sheet-open #stage{transform:scale(.94) translateY(14px);border-radius:22px;overflow:hidden;filter:brightness(.82)}
@media (min-width:760px){body.sheet-open #stage{transform:scale(.97);filter:brightness(.8)}}

/* top bar: floating glass buttons, the title fades in once the large title scrolls away */
#top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;pointer-events:none}
#top .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
#top .in>*{pointer-events:auto}
.gbtn{appearance:none;border:0;height:44px;min-width:44px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink);font-weight:600;font-size:15px;
  transition:transform var(--spring-d) var(--spring)}
.gbtn:active{transform:scale(.9)}
.gbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gbtn.icon{padding:0;width:44px}
#top .l{justify-self:start} #top .r{justify-self:end}
#top .t{font-weight:700;font-size:16px;padding:0 16px;height:36px;border-radius:999px;display:flex;align-items:center;opacity:0;transform:translateY(-6px) scale(.96);transition:opacity .25s,transform var(--spring-d) var(--spring);white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
body.scrolled #top .t{opacity:1;transform:none}

/* page */
main{position:relative;max-width:820px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 70px) 16px calc(env(safe-area-inset-bottom,0px) + 120px);display:flex;flex-direction:column;gap:16px}
.lt{margin:6px 4px 4px}
.lt h1{font-size:clamp(34px,8.5vw,44px);line-height:1.02;font-weight:800;letter-spacing:-.04em;margin:0}
.lt p{margin:6px 0 0;color:var(--muted);font-weight:500;font-size:15px}
.enter>*{animation:enter var(--spring-d) var(--spring) both;animation-delay:calc(var(--i,0) * 40ms)}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}
.from-r>*{animation-name:fromR} .from-l>*{animation-name:fromL}
@keyframes fromR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}

.card{background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,30,60,.04),0 0 0 1px var(--line)}
.card h3{font-size:19px;font-weight:700;letter-spacing:-.025em;margin:0}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.note{border-radius:18px;padding:12px 16px;font-size:14px;font-weight:600;color:var(--accent);background:var(--accent-soft)}
.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:0 22px;min-height:52px;border-radius:999px;
  transition:transform var(--spring-d) var(--spring),filter .2s;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.95)}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.danger{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.btn.sm{min-height:40px;font-size:15px;padding:0 18px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.link{appearance:none;border:0;background:none;color:var(--accent);font-weight:700;font-size:15px;padding:6px 2px}
.link.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=number],select{width:100%;padding:0 14px;border:0;border-radius:14px;background:var(--fill-2);min-height:48px;font-size:17px;font-weight:600;color:var(--ink);transition:box-shadow .2s}
input:focus,select:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft),inset 0 0 0 1.5px var(--accent)}

/* lists */
.list{background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,60,.04),0 0 0 1px var(--line)}
.row{appearance:none;width:100%;border:0;background:none;display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:14px;padding:12px 16px;text-align:left;position:relative;
  transition:background .2s,transform var(--spring-d) var(--spring)}
.row+.row::before{content:"";position:absolute;top:0;left:76px;right:16px;border-top:1px solid var(--line)}
button.row:hover{background:var(--fill-2)} button.row:active{transform:scale(.985);background:var(--fill)}
.num{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft)}
.row b{display:block;font-weight:700;letter-spacing:-.02em}
.row .meta{font-size:13.5px;color:var(--muted);font-weight:500}
.chip{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;white-space:nowrap;background:var(--fill);color:var(--muted)}
.chip.active{background:var(--good-soft);color:var(--good)} .chip.invited{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stats div{background:var(--card-2);border-radius:18px;padding:14px 16px}
.stats b{display:block;font-size:24px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.stats span{font-size:12.5px;color:var(--muted);font-weight:600}

/* floating tab bar with a liquid lens you can drag */
#tabs{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;transform:translateX(-50%);border-radius:999px;padding:5px;display:flex;gap:2px;
  touch-action:none;transition:transform var(--spring-d) var(--spring),opacity .3s,padding var(--settle-d) var(--settle)}
#tabs[hidden]{display:none}
#tabs.away{transform:translate(-50%,140%);opacity:0}
#tabs .lens{position:absolute;top:5px;bottom:5px;left:0;width:0;border-radius:999px;background:var(--lens);z-index:0;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(255,255,255,.35),0 4px 14px rgba(20,30,60,.12);
  transition:transform var(--spring-d) var(--spring),width var(--spring-d) var(--spring),scale var(--spring-d) var(--spring)}
#tabs.dragging .lens{transition:width var(--spring-d) var(--spring),scale var(--spring-d) var(--spring);scale:1.12 1.18;background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(2px) saturate(220%);backdrop-filter:blur(2px) saturate(220%)}
#tabs .lens.stretch{scale:1.18 .9}
#tabs button{appearance:none;border:0;background:none;position:relative;z-index:1;min-width:76px;height:54px;padding:0 14px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink-2);font-size:11px;font-weight:700;transition:color .25s,min-width var(--settle-d) var(--settle),height var(--settle-d) var(--settle)}
#tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--spring-d) var(--spring)}
#tabs button[aria-current="page"]{color:var(--accent)}
#tabs button:active svg{transform:scale(.82)}
/* shrinks while scrolling down, like iOS */
#tabs.mini{padding:4px}
#tabs.mini button{height:42px;min-width:54px}
#tabs.mini button span{display:none}
#tabs.mini .lens{top:4px;bottom:4px}

/* sheets */
#scrim{position:fixed;inset:0;z-index:30;background:rgba(5,8,15,.28);opacity:0;pointer-events:none;transition:opacity var(--settle-d) var(--settle)}
body.sheet-open #scrim{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;margin:0 auto;max-width:640px;max-height:calc(100vh - 56px);border-radius:30px 30px 0 0;
  display:flex;flex-direction:column;transform:translateY(105%);transition:transform var(--spring-d) var(--spring);will-change:transform}
#sheet.glass{background:color-mix(in srgb,var(--card) 82%,transparent)}
body.sheet-open #sheet{transform:translateY(0)}
#sheet.drag{transition:none}
@media (min-width:760px){#sheet{bottom:auto;top:50%;border-radius:30px;transform:translateY(-40%) scale(.92);opacity:0;transition:transform var(--spring-d) var(--spring),opacity .25s;max-height:86vh}
  body.sheet-open #sheet{transform:translateY(-50%);opacity:1}}
#sheet .grab{flex:none;height:28px;display:grid;place-items:center;cursor:grab;touch-action:none}
#sheet .grab i{width:40px;height:5px;border-radius:3px;background:var(--fill);display:block}
@media (min-width:760px){#sheet .grab{height:14px}#sheet .grab i{display:none}}
#sheet .sh{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px 8px 22px;touch-action:none}
#sheet .sh h2{font-size:24px;font-weight:800;letter-spacing:-.035em;margin:0;line-height:1.1}
#sheet .sb{overflow-y:auto;padding:8px 18px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
#sheet .sb .card{box-shadow:0 0 0 1px var(--line)}
.swap{animation:swap var(--spring-d) var(--spring) both}
@keyframes swap{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* one-time code */
.code{font:600 clamp(30px,9vw,40px)/1 var(--mono);letter-spacing:.06em;text-align:center;padding:22px 0;border-radius:20px;background:var(--card-2);user-select:all;animation:codeIn .7s var(--spring) both}
@keyframes codeIn{from{opacity:0;letter-spacing:.4em;filter:blur(6px)}to{opacity:1;letter-spacing:.06em;filter:none}}

/* sign-in */
.welcome{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 22px}
.welcome .mark{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;margin-bottom:22px}
.welcome .mark svg{width:42px;height:42px}
.welcome h1{font-size:clamp(40px,11vw,60px);font-weight:800;letter-spacing:-.05em;line-height:1;margin:0}
.welcome h1 em{font-style:normal;color:var(--accent)}
.welcome p.tag{color:var(--ink-2);font-size:17px;max-width:30ch;margin:14px 0 0}
.signin{width:100%;max-width:360px;margin-top:30px;border-radius:30px;padding:10px;display:flex;flex-direction:column;gap:8px}
.signin input{text-align:center;font:600 22px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:rgba(255,255,255,.35);min-height:56px;border-radius:22px}
@media (prefers-color-scheme:dark){.signin input{background:rgba(0,0,0,.25)}}
.signin .btn{min-height:56px;border-radius:22px}
.welcome .err{color:var(--bad);font-weight:600;margin:14px 0 0}
.welcome>*{animation:enter .9s var(--spring) both}
.welcome>*:nth-child(2){animation-delay:.08s}.welcome>*:nth-child(3){animation-delay:.16s}.welcome>*:nth-child(4){animation-delay:.24s}.welcome>*:nth-child(5){animation-delay:.32s}
.shake{animation:shake .5s var(--settle)}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:50;transform:translate(-50%,-160%);padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;
  transition:transform var(--spring-d) var(--spring);pointer-events:none}
#toast.on{transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#field i{animation:none}}
</style>
</head>
<body>
<div id="field" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="stage">
  <header id="top" hidden><div class="in"><span class="l"></span><span class="t glass"></span><span class="r"></span></div></header>
  <main id="page"></main>
</div>
<nav id="tabs" class="glass" aria-label="Sections" hidden></nav>
<div id="scrim"></div>
<section id="sheet" class="glass" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden><div class="grab" aria-hidden="true"><i></i></div><div class="sh"></div><div class="sb"></div></section>
<div id="toast" class="glass" role="status"></div>
<script>
const APP_NAME = "Offseason College"; // working name; change here
const $ = (s, el = document) => el.querySelector(s);
const PAGE = $("#page"), TOP = $("#top"), TABS = $("#tabs"), SHEET = $("#sheet");
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const S = { view: "boot", tab: null, sheet: null };
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const POS = ["C", "1B", "2B", "3B", "SS", "LF", "CF", "RF", "OF", "IF", "UT", "DH", "P"];
const CLASS = ["Fr", "So", "Jr", "Sr", "Gr", "RS Fr", "RS So", "RS Jr", "RS Sr"];
const ERR = { name: "First and last name are needed.", last_coach: "A team needs at least one coach.", coach_only: "Only coaches can do that.", season: "Season should be a year, like 2026.", missing: "Fill in the team, season and head coach.", no_database: "The database isn't connected yet.", server: "Something went wrong. Try again." };
const I = {
  back: '<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  roster: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M15.8 14.2c2.3.2 4 1.8 4.6 4.8"/></svg>',
  staff: '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 4.5V3.5h6v1M9 10h6M9 14h6M9 18h3"/></svg>',
  team: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5.5c0 4.3-3 7.7-7 9.5-4-1.8-7-5.2-7-9.5V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  me: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-3.8 3.6-6 7-6s6.2 2.2 7 6"/></svg>',
  account: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M4.2 7.5l2.1 1.2M17.7 15.3l2.1 1.2M4.2 16.5l2.1-1.2M17.7 8.7l2.1-1.2"/></svg>',
  ball: '<svg viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="18" stroke="currentColor" stroke-width="2.6"/><path d="M14 9.5c4.6 3.8 7 8.8 7 14.5s-2.4 10.7-7 14.5M34 9.5c-4.6 3.8-7 8.8-7 14.5s2.4 10.7 7 14.5" stroke="var(--ember)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 4.2"/></svg>',
};

/* ---------- motion: real spring curves, written into CSS as linear() easings ---------- */
function spring(stiffness, damping) {
  const dt = 1 / 120, pts = []; let x = 0, v = 0;

  let r;
  try { r = await fetch(`/api/${name}${qs ? "?" + qs : ""}`, { method, cache: "no-store", headers: { Authorization: "Bearer " + (S.token || ""), ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined }); }
  catch { throw { code: "offline" }; }

(() => {

    if (!drag || e.pointerId !== drag.id) return;

    const lens = $(".lens", TABS), r = TABS.getBoundingClientRect(), w = lens.offsetWidth;
    const x = Math.max(5, Math.min(r.width - w - 5, e.clientX - r.left - w / 2));
    lens.style.transform = `translateX(${x}px)`;
    const over = [...TABS.querySelectorAll("button")].find((b) => { const br = b.getBoundingClientRect(); return e.clientX >= br.left && e.clientX <= br.right; });
    TABS.querySelectorAll("button").forEach((b) => b.style.color = b === over ? "var(--accent)" : "");
  });

    if (!drag || e.pointerId !== drag.id) return;
    const moved = drag.moved; drag = null;
    if (!moved) return;
    TABS.classList.remove("dragging"); TABS.querySelectorAll("button").forEach((b) => b.style.color = "");
    const btns = [...TABS.querySelectorAll("button")];
    const near = btns.reduce((a, b) => { const c = (x) => { const r = x.getBoundingClientRect(); return Math.abs(e.clientX - (r.left + r.width / 2)); }; return c(b) < c(a) ? b : a; });

    if (!d || e.pointerId !== d.id) return;
    const dy = e.clientY - d.y0; d.y = dy < 0 ? -Math.sqrt(-dy) * 2 : dy; // rubber band upward
    SHEET.style.transform = `translateY(${d.y}px)`;
    const k = Math.max(0, Math.min(1, d.y / 400)); $("#stage").style.transform = `scale(${.94 + .06 * k}) translateY(${14 * (1 - k)}px)`;
  });
  const end = (e) => {
    if (!d || e.pointerId !== d.id) return;
    const v = d.y / Math.max(1, performance.now() - d.t0), y = d.y; d = null;
    SHEET.classList.remove("drag"); $("#stage").style.transform = "";
    if (y > 130 || (v > 0.6 && y > 30)) closeSheet(); else SHEET.style.transform = "";
  };
  SHEET.addEventListener("pointerup", end); SHEET.addEventListener("pointercancel", end);
})();
$("#scrim").addEventListener("click", () => closeSheet());
addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ---------- actions ---------- */
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "signin") return; e.preventDefault();
  const code = $("#code").value.trim();
  if (code.replace(/[^A-Za-z0-9]/g, "").length < 10) { const f = $("#signin"); f.classList.remove("shake"); f.offsetWidth; f.classList.add("shake"); haptic(); return; }
  S.token = code.toUpperCase(); ls.set("oc-token", S.token); S.signinErr = "";
  boot();
});
TABS.addEventListener("click", (e) => { if (TABS.dataset.justDragged) return; const b = e.target.closest("button[data-tab]"); if (b) selectTab(b.dataset.tab); });
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, T = S.team && S.team.team.id, id = b.dataset.id;
  const refresh = async () => { await reloadTeam(); renderPage(); };
  try {
    if (a === "signout") return signOut();
    if (a === "team") return openTeam(id);
    if (a === "teams") { closeSheet(true); ls.set("oc-team", null); S.me = await api("me"); return showTeams(); }
    if (a === "sheet") return openSheet(b.dataset.s, { id });
    if (a === "close") return closeSheet();
    if (a === "confirm") { S.confirm = id; haptic(); return renderSheet(false); }
    if (a === "unconfirm") { S.confirm = null; return renderSheet(false); }
    if (a === "add-save") { await api("players", { method: "POST", query: { team: T }, body: readPlayerForm() }); closeSheet(); await refresh(); return toast("Player added"); }
    if (a === "edit-save") { await api("players", { method: "PATCH", query: { team: T, id }, body: readPlayerForm() }); await refresh(); openSheet("player", { id }); return toast("Saved"); }
    if (a === "pcode") { const p = playerById(id); const r = await api("access", { method: "POST", query: { team: T }, body: { player: id } }); await refresh();
      return openSheet("code", { title: `${p.first}'s code`, code: r.code, note: `Send this to ${fullName(p)}. He signs in once on his phone.`, back: id }); }
    if (a === "pdel") { await api("players", { method: "DELETE", query: { team: T, id } }); closeSheet(); await refresh(); return toast("Removed from roster"); }
    if (a === "sc-save") { const name = val("sc-name"); const r = await api("access", { method: "POST", query: { team: T }, body: { coach: name } }); await refresh();
      return openSheet("code", { title: `${name}'s code`, code: r.code, note: `Send this to ${name}.` }); }
    if (a === "scode") { const c = S.team.staff.find((x) => x.id === id); const r = await api("access", { method: "POST", query: { team: T }, body: { user: id } }); await refresh();
      return openSheet("code", { title: `${c.name}'s new code`, code: r.code, note: "The old code has stopped working." }); }
    if (a === "sdel") { await api("access", { method: "DELETE", query: { team: T, user: id } }); closeSheet(); await refresh(); return toast("Coach removed"); }
    if (a === "tm-save") { await api("team", { method: "PATCH", query: { id: T }, body: { name: val("tm-name"), shortName: val("tm-short"), season: val("tm-season") } }); closeSheet(); await refresh(); return toast("Saved"); }
    if (a === "nt-save") { const coachName = val("nt-coach"); const r = await api("team", { method: "POST", body: { name: val("nt-name"), shortName: val("nt-short"), season: val("nt-season"), coachName } });
      S.me = await api("me"); showTeams(); return openSheet("code", { title: "Head coach's code", code: r.code, note: `Send this to ${coachName} at ${r.team.name}.` }); }
    if (a === "copy") { try { await navigator.clipboard.writeText(S.sheet.code); toast("Copied"); haptic(); } catch { toast("Select the code to copy it"); } return; }
  } catch (err) { if (err && err.code !== "sign_in") fail(err); }
});
boot();
</script>
